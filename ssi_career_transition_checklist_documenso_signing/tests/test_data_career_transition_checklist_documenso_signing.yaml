scenarios:
  - name: "Career Transition Checklist - Documenso Signing: has signing fields"
    steps:
      - step: "Setup - create employee job position"
        action: "create"
        model: "hr.job"
        save_as: "job"
        values:
          name: "Test Job CTC DS"

      - step: "Setup - create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Test Employee CTC DS"
          job_id: "EVAL: registry['job'].id"

      - step: "Setup - create career transition type"
        action: "create"
        model: "employee_career_transition_type"
        save_as: "transition_type"
        values:
          name: "Test Transition Type CTC DS"
          code: "TTCTCDS"

      - step: "Setup - create career transition"
        action: "create"
        model: "employee_career_transition"
        save_as: "career_transition"
        as_user: "base.user_admin"
        values:
          employee_id: "EVAL: registry['employee'].id"
          type_id: "EVAL: registry['transition_type'].id"

      - step: "Setup - create checklist type"
        action: "create"
        model: "career_transition_checklist_type"
        save_as: "checklist_type"
        values:
          name: "Test Checklist Type DS"
          code: "CTDS001"

      - step: "Create career transition checklist"
        action: "create"
        model: "career_transition_checklist"
        save_as: "checklist"
        as_user: "base.user_admin"
        values:
          employee_id: "EVAL: registry['employee'].id"
          career_transition_id: "EVAL: registry['career_transition'].id"
          type_id: "EVAL: registry['checklist_type'].id"

      - step: "Assert checklist has documenso signing fields"
        action: "assert"
        target: "checklist"
        asserts:
          state:
            type: "value"
            expected: "draft"
          signature_request_ids:
            type: "value"
            operator: "is_falsy"
          approval_signature_request_id:
            type: "value"
            operator: "is_falsy"
